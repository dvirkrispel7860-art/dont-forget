name: CI

# Every push and every pull request. A branch that fails here should not be
# merged, and `main` failing is a signal something got in that should not have.
on:
  push:
    branches: [main]
  pull_request:
  # So a run can be started by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless — stop it rather
# than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Restores ~/.npm between runs, which is most of the wall clock here.
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json says, so CI cannot pass on a dependency tree that the
      # repo does not describe.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # 377 assertions over the app's own logic modules — location, the bus
      # departure timing, notification scheduling and the AI provider layer.
      # No device and no network: each suite stubs the platform it needs.
      - name: Tests
        run: npm test

      # Proves the app still bundles. A type error and a bundler error are
      # different failures, and this catches the second kind.
      - name: Web build
        run: npm run build:web

      # Kept so a failing build can be inspected without reproducing it locally.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7
